<!doctype html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>New Tab</title>
  <link rel="icon" href="icons/icon48.png" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <img src="icons/icon48.png" alt="" class="brand-logo" />
        <span class="brand-name">U NEWS</span>
      </div>

      <nav class="nav" id="nav" aria-label="Sections">
        <button class="nav-item active" data-section="main">
          <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>
          <span>Main News</span>
        </button>
        <button class="nav-item" data-section="world">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/></svg>
          <span>World</span>
        </button>
        <button class="nav-item" data-section="politics">
          <svg viewBox="0 0 24 24"><path d="M3 10l9-6 9 6M5 10v8M9 10v8M15 10v8M19 10v8M3 20h18"/></svg>
          <span>Politics</span>
        </button>
        <button class="nav-item" data-section="business">
          <svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a1 1 0 011-1h4a1 1 0 011 1v2M3 13h18"/></svg>
          <span>Business</span>
        </button>
        <button class="nav-item" data-section="technology">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>
          <span>Technology</span>
        </button>
        <button class="nav-item" data-section="sports">
          <svg viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 01-10 0V4zM17 5h3v2a3 3 0 01-3 3M7 5H4v2a3 3 0 003 3"/></svg>
          <span>Sports</span>
        </button>
      </nav>

      <div class="side-heading">Quick Links</div>
      <nav class="nav quick" aria-label="Quick links">
        <a class="nav-item" href="https://www.reuters.com" rel="noopener">
          <span class="badge badge-reuters">R</span><span>Reuters</span>
        </a>
        <a class="nav-item" href="https://apnews.com" rel="noopener">
          <span class="badge badge-ap">AP</span><span>AP News</span>
        </a>
        <a class="nav-item" href="https://www.bbc.com/news" rel="noopener">
          <span class="badge badge-bbc">BBC</span><span>BBC</span>
        </a>
        <a class="nav-item" href="https://www.npr.org" rel="noopener">
          <span class="badge badge-npr">npr</span><span>NPR</span>
        </a>
        <a class="nav-item" href="https://www.dw.com" rel="noopener">
          <span class="badge badge-dw">DW</span><span>Deutsche Welle</span>
        </a>
        <button class="nav-item" id="open-settings">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>
          <span>Settings</span>
        </button>
      </nav>
    </aside>

    <!-- Main -->
    <main class="main">
      <header class="topbar">
        <form class="search" id="search-form" role="search">
          <svg viewBox="0 0 24 24" class="search-icon"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input id="search" type="search" placeholder="Search articles, topics, or regions..." autocomplete="off" />
          <kbd class="kbd">/</kbd>
        </form>
        <div class="clock" aria-live="off">
          <div class="clock-date" id="clock-date"></div>
          <div class="clock-time" id="clock-time"></div>
        </div>
      </header>

      <div class="content">
        <section class="left">
          <article class="hero" id="hero" aria-live="polite">
            <div class="skeleton hero-skeleton"></div>
          </article>
          <div class="cards" id="cards"></div>
        </section>

        <aside class="right">
          <section class="panel">
            <div class="panel-head">
              <h2>Latest Articles</h2>
              <button class="link-btn" id="view-all">View all <span aria-hidden="true">&rarr;</span></button>
            </div>
            <ul class="latest" id="latest"></ul>
          </section>

          <section class="quote panel">
            <div class="quote-head"><span class="quote-mark">&ldquo;</span> Quote of the Day</div>
            <p class="quote-text" id="quote-text"></p>
            <p class="quote-author" id="quote-author"></p>
          </section>
        </aside>
      </div>

      <!-- <p class="status" id="status" role="status"></p> -->
    </main>
  </div>

  <!-- Settings dialog -->
  <dialog id="settings" class="dialog">
    <form method="dialog" class="dialog-body">
      <h2>Settings</h2>

      <label class="field">
        <span>Theme</span>
        <select id="set-theme">
          <option value="auto">Match system</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </label>

      <label class="field">
        <span>Clock format</span>
        <select id="set-clock">
          <option value="24">24-hour</option>
          <option value="12">12-hour</option>
        </select>
      </label>

      <label class="field">
        <span>Refresh feeds every</span>
        <select id="set-refresh">
          <option value="5">5 minutes</option>
          <option value="15">15 minutes</option>
          <option value="30">30 minutes</option>
          <option value="60">1 hour</option>
        </select>
      </label>

      <div class="dialog-actions">
        <button value="close" class="btn">Done</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
